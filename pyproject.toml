[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vakyalang"
dynamic = ["version"]                    # ← Magic: version comes from git tags
authors = [{ name = "Raj Mitra" }]
description = "A Sanskrit-inspired programming language and symbolic computing ecosystem based on Pāṇinian grammar and Nyāya reasoning."
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "sanskrit", "programming-language", "compiler", "vm", "nyaya-logic",
    "panini-grammar", "symbolic-computing", "devanagari", "vakyalang"
]
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Natural Language :: Sanskrit",
]

[project.urls]
Homepage = "https://github.com/Sansmatic-z/VakyaLang"
"Bug Tracker" = "https://github.com/Sansmatic-z/VakyaLang/issues"
"Source" = "https://github.com/Sansmatic-z/VakyaLang"

[project.scripts]
vak = "runtime.run:main"
sanskrit-coder = "sanskrit_coder.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "sanskrit_coder*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"          # shows git hash + date in dev mode
write_to = "runtime/_version.py"        # auto-generates clean __version__ file
write_to_template = """
__version__ = '{version}'
__version_tuple__ = {version_tuple}
"""
